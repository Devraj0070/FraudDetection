# Production Configuration Profile for SafePay
# In production, Hibernate DDL auto-generation is strictly set to 'validate' to prevent uncontrolled schema drift.
# Database schema must be managed explicitly using schema-migration.sql or automated versioned migration tools.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# High-security production logging
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.frauddetection=INFO

# Production ML Operating Threshold (Calibrated for balanced precision/recall)
safepay.ml.fraud-threshold=0.25
