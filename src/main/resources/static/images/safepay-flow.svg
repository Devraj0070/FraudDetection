<svg class="brand-flow-svg" viewBox="0 0 680 960" fill="none" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background atmospheric glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="46%" r="58%" fx="46%" fy="42%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#03458b" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#041838" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#040814" stop-opacity="0" />
    </radialGradient>

    <!-- Deep core glow behind central ribbon fold -->
    <radialGradient id="coreGlow" cx="46%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.26" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Layer 1: Distant soft ambient background wave -->
    <linearGradient id="backWaveGrad" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#0f2b5c" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#041226" stop-opacity="0.65" />
    </linearGradient>

    <!-- Layer 2: Secondary under-ribbon (deep 3D shadow and fold) -->
    <linearGradient id="underRibbonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#041228" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#0b3870" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#0284c7" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.4" />
    </linearGradient>

    <!-- Layer 3: Main foreground flowing ribbon (front 3D surface) -->
    <linearGradient id="mainRibbonGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#f0f9ff" stop-opacity="0.95" />
      <stop offset="12%" stop-color="#7dd3fc" stop-opacity="0.95" />
      <stop offset="28%" stop-color="#00d2ff" stop-opacity="0.92" />
      <stop offset="52%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="78%" stop-color="#0f3b7a" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#061836" stop-opacity="0.92" />
    </linearGradient>

    <!-- Layer 4: Polished top crest facet (overhead light reflection) -->
    <linearGradient id="crestGrad" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#7dd3fc" stop-opacity="0.88" />
      <stop offset="55%" stop-color="#0ea5e9" stop-opacity="0.7" />
      <stop offset="85%" stop-color="#0369a1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#082f49" stop-opacity="0" />
    </linearGradient>

    <!-- Specular rim strokes -->
    <linearGradient id="specularRim1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#7dd3fc" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="specularRim2" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.25" />
    </linearGradient>

    <!-- Translucent floating depth ribbons -->
    <linearGradient id="floatingRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>

    <!-- 3D Volumetric Shadows and Blur Filters -->
    <filter id="softDepthShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-10" dy="18" stdDeviation="24" flood-color="#020817" flood-opacity="0.75" />
    </filter>

    <filter id="deepCreaseShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-4" dy="8" stdDeviation="12" flood-color="#01040a" flood-opacity="0.85" />
    </filter>

    <filter id="glowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- 1. AMBIENT BACKGROUND LIGHTING -->
  <rect width="680" height="960" fill="url(#ambientGlow)" />
  <circle cx="320" cy="480" r="280" fill="url(#coreGlow)" filter="url(#glowBlur)" />

  <!-- 2. DEEP BACKGROUND SCULPTED WAVE (ATMOSPHERIC DEPTH) -->
  <path d="M -40 280 C 140 180, 360 220, 520 140 C 620 90, 680 50, 740 10 L 740 680 C 640 760, 480 820, 320 840 C 140 860, 20 800, -40 740 Z"
        fill="url(#backWaveGrad)" opacity="0.65" />

  <!-- 3. TRANSLUCENT AURA RIBBON (ELEGANT UPWARD FLOW) -->
  <path d="M 120 980 C 220 820, 380 720, 480 580 C 580 440, 620 300, 660 120 C 680 60, 660 40, 620 60 C 560 180, 480 340, 380 480 C 280 620, 160 740, 60 880 Z"
        fill="url(#floatingRibbon)" />

  <!-- 4. SECONDARY UNDER-RIBBON (CREATES 3D FOLD / OCCLUSION) -->
  <path d="M -60 620 C 80 540, 240 480, 380 380 C 490 300, 560 210, 620 100 C 640 160, 620 250, 550 350 C 460 480, 320 580, 180 680 C 60 760, -20 820, -60 860 Z"
        fill="url(#underRibbonGrad)" filter="url(#softDepthShadow)" />

  <!-- 5. PRIMARY HERO SCULPTED RIBBON (FRONT 3D SURFACE) -->
  <path d="M -80 780 C 60 660, 200 580, 340 460 C 460 360, 560 240, 640 90 C 660 120, 670 170, 650 220 C 580 370, 460 490, 320 610 C 180 720, 40 820, -60 920 Z"
        fill="url(#mainRibbonGrad)" filter="url(#deepCreaseShadow)" />

  <!-- 6. POLISHED CREST SURFACE (TOP-LIT FACET) -->
  <path d="M -80 780 C 60 660, 200 580, 340 460 C 460 360, 560 240, 640 90 C 625 95, 600 115, 570 145 C 470 245, 370 345, 260 445 C 150 545, 30 645, -80 730 Z"
        fill="url(#crestGrad)" />

  <!-- 7. CRISP SPECULAR LIGHT RIM 1 (TOP EDGE REFLECTION) -->
  <path d="M -80 780 C 60 660, 200 580, 340 460 C 460 360, 560 240, 640 90"
        stroke="url(#specularRim1)" stroke-width="2.5" stroke-linecap="round" />

  <!-- 8. CRISP SPECULAR LIGHT RIM 2 (INNER ACCENT RIDGE) -->
  <path d="M -60 730 C 70 620, 210 535, 330 435 C 435 345, 520 240, 590 130"
        stroke="url(#specularRim2)" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />

  <!-- 9. DELICATE FOREGROUND TRANSLUCENT SWEEP (LIGHT VEIL) -->
  <path d="M 180 940 C 290 820, 410 710, 510 560 C 580 450, 620 340, 640 220 C 650 245, 645 280, 620 330 C 530 500, 410 640, 270 780 C 190 855, 120 910, 60 950 Z"
        fill="url(#floatingRibbon)" opacity="0.5" />
</svg>
