<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Fraud Detection System</title>

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>

<div class="auth-container">

    <!-- Header -->
    <div class="auth-header">
        <div class="app-name">Fraud Detection System</div>
        <h1>Create Account</h1>
        <p>Get started with secure transactions</p>
    </div>

    <!-- Card -->
    <div class="auth-card">

        <!-- Validation Error Message -->
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}">
            Validation error
        </div>

        <!-- Registration Form -->
        <form class="auth-form" th:action="@{/register}" method="post">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    th:value="${user != null ? user.username : ''}"
                    placeholder="Choose a username"
                    required
                    autofocus>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    th:value="${user != null ? user.email : ''}"
                    placeholder="Enter your email address"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a strong password"
                    required>
            </div>

            <button type="submit" class="btn-submit">Create Account</button>

        </form>

        <!-- Footer -->
        <div class="auth-footer">
            Already have an account?
            <a href="/login">Sign in here</a>
        </div>

    </div>

</div>

</body>
</html>
