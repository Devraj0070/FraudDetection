<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — SAFE PAY</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body class="auth-page">

<div class="auth-split-wrapper">

    <!-- LEFT / CREATE ACCOUNT FORM -->
    <main class="auth-form-pane">
        <div class="form-pane-container">

            <div class="auth-form-header">
                <h1>Create Account</h1>
                <p>Get started with your SafePay account.</p>
            </div>

            <!-- Validation Error Alert -->
            <div th:if="${errorMessage}" class="alert alert-error">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span th:text="${errorMessage}">Validation error</span>
            </div>

            <!-- Registration Form -->
            <form class="auth-form" th:action="@{/register}" method="post">

                <div class="form-field">
                    <label for="username">Username</label>
                    <div class="input-with-icon">
                        <svg class="input-icon-left" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="auth-input"
                            th:value="${user != null ? user.username : ''}"
                            placeholder="Choose a username"
                            required
                            autofocus>
                    </div>
                </div>

                <div class="form-field">
                    <label for="email">Email Address</label>
                    <div class="input-with-icon">
                        <svg class="input-icon-left" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="auth-input"
                            th:value="${user != null ? user.email : ''}"
                            placeholder="Email address"
                            required>
                    </div>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <svg class="input-icon-left" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="auth-input"
                            placeholder="Create a strong password"
                            required>
                    </div>
                </div>

                <button type="submit" class="btn-auth-submit">
                    Create Account
                </button>

            </form>

            <div class="auth-switch-footer">
                Already have an account?
                <a th:href="@{/login}">Sign in here</a>
            </div>

        </div>

        <p class="auth-copyright">Copyright &copy; 2026 SAFE PAY. All rights reserved.</p>
    </main>

    <!-- RIGHT / BRAND PANE (indigo, curved edge, outline shapes) -->
    <aside class="auth-brand-pane">

        <!-- Curved indigo background (stretches to fit the pane) -->
        <svg class="auth-curve" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <defs>
                <linearGradient id="authIndigo" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#2f2f9a"/>
                    <stop offset="1" stop-color="#232375"/>
                </linearGradient>
            </defs>
            <path d="M4 0 H100 V100 H29 C28 70 19 46 14 32 C11 22 5 10 4 0 Z" fill="url(#authIndigo)"/>
        </svg>

        <!-- Decorative outline shapes -->
        <svg class="auth-shapes" viewBox="0 0 436 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <defs>
                <linearGradient id="authShapeGrad" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#3b3fb6"/>
                    <stop offset="1" stop-color="#1c1c66"/>
                </linearGradient>
            </defs>
            <g fill="none" stroke="#4a63d6" stroke-width="2" opacity="0.55">
                <!-- squiggle top-left -->
                <path d="M108 78 q16 -26 36 -6 t36 -4" stroke-width="5" stroke-linecap="round"/>
                <!-- top circle -->
                <circle cx="228" cy="36" r="24"/>
                <!-- triangles -->
                <path d="M338 106 l14 26 h-28 z"/>
                <path d="M196 524 l30 0 l-30 30 z"/>
                <!-- big circle -->
                <circle cx="352" cy="318" r="86"/>
                <!-- small circles -->
                <circle cx="366" cy="262" r="9"/>
                <circle cx="330" cy="470" r="9"/>
                <circle cx="132" cy="262" r="9"/>
                <!-- plus signs -->
                <path d="M196 232 h40 M216 212 v40" stroke-width="2.5"/>
                <path d="M410 392 h22 M421 381 v22"/>
                <path d="M358 548 h22 M369 537 v22"/>
                <!-- S squiggle -->
                <path d="M174 440 c20 -6 22 12 8 22 c-14 10 -10 26 8 22" stroke-width="3" stroke-linecap="round"/>
            </g>
            <!-- gradient half circle -->
            <path d="M150 140 A38 38 0 1 1 150 216 C170 190 170 166 150 140 Z" fill="url(#authShapeGrad)" opacity="0.8"/>
            <!-- gradient cut inside the big circle -->
            <path d="M338 236 C376 242 378 284 362 322 C348 356 362 390 384 400 A86 86 0 0 1 338 236 Z" fill="url(#authShapeGrad)" opacity="0.75"/>
        </svg>

        <div class="brand-pane-content">
            <a th:href="@{/register}" class="brand-logo-link">
                <img th:src="@{/images/safepay-logo.png}" alt="SAFE PAY" class="auth-brand-logo">
            </a>
            <p class="brand-tagline">Create your SafePay account</p>
        </div>
    </aside>

</div>

</body>
</html>
