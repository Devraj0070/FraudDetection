<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — SAFE PAY</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body class="auth-page">

<div class="auth-split-wrapper">

    <!-- LEFT / BRAND PANE -->
    <aside class="auth-brand-pane">
        <!-- Abstract Digital Payment Flow Hero Visual -->
        <div class="brand-hero-visual" aria-hidden="true"></div>

        <div class="brand-pane-content">
            <a th:href="@{/register}" class="brand-logo-link">
                <img th:src="@{/images/safepay-logo.png}" alt="SAFE PAY" class="auth-brand-logo">
            </a>
            <p class="brand-tagline">Create your SafePay account</p>
        </div>
    </aside>

    <!-- RIGHT / CREATE ACCOUNT FORM -->
    <main class="auth-form-pane">
        <div class="form-pane-container">

            <div class="auth-form-header">
                <h1>Create Account</h1>
                <p>Get started with your SafePay account.</p>
            </div>

            <!-- Validation Error Alert -->
            <div th:if="${errorMessage}" class="alert alert-error">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span th:text="${errorMessage}">Validation error</span>
            </div>

            <!-- Registration Form -->
            <form class="auth-form" th:action="@{/register}" method="post">

                <div class="form-field">
                    <label for="username">Username</label>
                    <div class="input-with-icon">
                        <svg class="input-icon-left" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="auth-input"
                            th:value="${user != null ? user.username : ''}"
                            placeholder="Choose a username"
                            required
                            autofocus>
                    </div>
                </div>

                <div class="form-field">
                    <label for="email">Email Address</label>
                    <div class="input-with-icon">
                        <svg class="input-icon-left" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="auth-input"
                            th:value="${user != null ? user.email : ''}"
                            placeholder="Enter your email address"
                            required>
                    </div>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <svg class="input-icon-left" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="auth-input"
                            placeholder="Create a strong password"
                            required>
                    </div>
                </div>

                <button type="submit" class="btn-auth-submit">
                    Create SafePay Account
                </button>

            </form>

            <div class="auth-switch-footer">
                Already have an account?
                <a th:href="@{/login}">Sign in here</a>
            </div>

        </div>
    </main>

</div>

</body>
</html>
