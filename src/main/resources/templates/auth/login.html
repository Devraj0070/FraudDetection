<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Fraud Detection System</title>

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>

<div class="auth-container">

    <!-- Header -->
    <div class="auth-header">
        <div class="app-name">Fraud Detection System</div>
        <h1>Welcome Back</h1>
        <p>Sign in to your account</p>
    </div>

    <!-- Card -->
    <div class="auth-card">

        <!-- Error Message (Spring Security default parameter) -->
        <div th:if="${param.error}" class="alert alert-error">
            Invalid username or password. Please try again.
        </div>

        <!-- Registration Success Message -->
        <div th:if="${param.registered}" class="alert alert-success">
            Registration successful! Please sign in with your credentials.
        </div>

        <!-- Logout Message -->
        <div th:if="${param.logout}" class="alert alert-success">
            You have been successfully logged out.
        </div>

        <!-- Login Form -->
        <form class="auth-form" th:action="@{/login}" method="post">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>

        </form>

        <!-- Footer -->
        <div class="auth-footer">
            Don't have an account?
            <a href="/register">Create one here</a>
        </div>

    </div>

</div>

</body>
</html>
