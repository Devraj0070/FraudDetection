<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — SAFE PAY</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body class="auth-page">

<div class="auth-split-wrapper">

    <!-- LEFT / BRAND PANE -->
    <aside class="auth-brand-pane">
        <!-- Abstract Digital Payment Flow Hero Visual -->
        <div class="brand-hero-visual" aria-hidden="true"></div>

        <div class="brand-pane-content">
            <a th:href="@{/login}" class="brand-logo-link">
                <img th:src="@{/images/safepay-logo.png}" alt="SAFE PAY" class="auth-brand-logo">
            </a>
            <p class="brand-tagline">Secure digital banking</p>
        </div>
    </aside>

    <!-- RIGHT / SIGN IN FORM -->
    <main class="auth-form-pane">
        <div class="form-pane-container">

            <div class="auth-form-header">
                <h1>Sign In</h1>
                <p>Welcome back.</p>
            </div>

            <!-- Feedback Alerts -->
            <div th:if="${param.error}" class="alert alert-error">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>Invalid username or password. Please try again.</span>
            </div>

            <div th:if="${param.registered}" class="alert alert-success">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <span>Registration successful! Please sign in with your credentials.</span>
            </div>

            <div th:if="${param.logout}" class="alert alert-info">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
                <span>You have been successfully signed out.</span>
            </div>

            <!-- Sign In Form -->
            <form class="auth-form" th:action="@{/login}" method="post">

                <div class="form-field">
                    <label for="username">Username</label>
                    <div class="input-with-icon">
                        <svg class="input-icon-left" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="auth-input"
                            placeholder="Enter your username"
                            required
                            autofocus>
                    </div>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <svg class="input-icon-left" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="auth-input"
                            placeholder="Enter your password"
                            required>
                    </div>
                </div>

                <button type="submit" class="btn-auth-submit">
                    Sign In
                </button>

            </form>

            <div class="auth-switch-footer">
                Don't have an account?
                <a th:href="@{/register}">Create an account</a>
            </div>

        </div>
    </main>

</div>

</body>
</html>
