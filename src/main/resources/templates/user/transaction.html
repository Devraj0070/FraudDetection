<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transaction - Fraud Detection System</title>
</head>

<body>

    <h1>Check Transaction</h1>

    <p>Enter the transaction amount to check its fraud risk.</p>

    <form th:action="@{/transaction}" method="post">

        <div>
            <label for="amount">Transaction Amount:</label>

            <input
                type="number"
                id="amount"
                name="amount"
                step="0.01"
                min="0"
                required>
        </div>

        <br>

        <button type="submit">Check Transaction</button>

    </form>

    <br>

    <a href="/dashboard">Back to Dashboard</a>

</body>
</html>
