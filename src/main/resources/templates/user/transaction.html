<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Transaction - Fraud Detection System</title>

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/transaction.css}">
</head>

<body>

<div class="transaction-container">

    <div class="transaction-header">
        <h1>New Transaction</h1>
        <p>Enter transaction details for fraud risk analysis</p>
    </div>

    <div class="transaction-card">

        <form th:action="@{/transaction}" method="post">

            <div class="form-group">
                <label for="amount">Transaction Amount</label>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        step="0.01"
                        min="0.01"
                        placeholder="0.00"
                        required
                        autofocus>
                </div>
                <span class="input-hint">Enter the amount you wish to transfer</span>
            </div>

            <div class="form-group">
                <label for="transactionType">Transaction Type</label>
                <select id="transactionType" name="transactionType" required>
                    <option value="">-- Select Type --</option>
                    <option value="PAYMENT">Payment</option>
                    <option value="TRANSFER">Transfer</option>
                    <option value="CASH_OUT">Cash Out</option>
                    <option value="DEBIT">Debit</option>
                    <option value="CASH_IN">Cash In</option>
                </select>
                <span class="input-hint">Select the type of transaction</span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    Submit Transaction
                </button>
                <a href="/dashboard" class="btn btn-secondary">
                    Cancel
                </a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
