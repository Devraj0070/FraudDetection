<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transaction Result - Fraud Detection System</title>
</head>

<body>

    <h1>Transaction Fraud Analysis</h1>

    <p th:text="${message}">
        Your transaction has been processed.
    </p>

    <p>
        Prediction:
        <strong th:text="${prediction}">LEGITIMATE</strong>
    </p>

    <p>
        Fraud probability:
        <span th:text="${#numbers.formatPercent(fraudProbability, 1, 2)}">0%</span>
    </p>

    <p>
        Model:
        <span th:text="${modelName}">Random Forest</span>
    </p>

    <p>
        Transaction status:
        <span th:text="${transactionStatus}">APPROVED</span>
    </p>

    <br>

    <a href="/transaction">Submit Another Transaction</a>

    <br><br>

    <a href="/dashboard">Back to Dashboard</a>

</body>
</html>
