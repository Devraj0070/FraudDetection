<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Access Restricted — SAFE PAY</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>

<div class="error-container">

    <div class="error-brand-header">
        <a th:href="@{/dashboard}">
            <img th:src="@{/images/safepay-logo.png}" alt="SAFE PAY" class="error-logo-img">
        </a>
    </div>

    <div class="error-card">
        <div class="error-icon-wrapper icon-wrap-denied">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>

        <span class="error-badge badge-403">403 Restricted</span>

        <h1 class="error-title">Access Restricted</h1>

        <p class="error-description">
            You do not possess the required security authorization to view this resource. This zone is exclusively reserved for authenticated SafePay system administrators and fraud compliance officers.
        </p>

        <div class="error-actions">
            <a th:href="@{/dashboard}" class="btn-error-primary">Return to Dashboard</a>
        </div>
    </div>

    <div class="error-security-footer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <path d="m9 12 2 2 4-4"></path>
        </svg>
        <span>SafePay Security Cloud &bull; Role-Based Access Control</span>
    </div>

</div>

</body>
</html>
